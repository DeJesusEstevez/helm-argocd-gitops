{{- /*
Cuenta propia para los pods, sin token de la API de Kubernetes: la aplicación
no necesita hablar con el clúster.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "intec-web.fullname" . }}
  labels:
    {{- include "intec-web.labels" . | nindent 4 }}
automountServiceAccountToken: false
